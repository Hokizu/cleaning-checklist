<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6a43" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="清掃記録" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <title>清掃担当者チェックリスト</title>
  </head>
  <body>
    <div class="app-shell">
      <main class="sheet-panel" id="sheetArea" aria-label="清掃チェックリスト">
        <header class="sheet-header">
          <div>
            <p class="eyebrow">DAILY CLEANING LOG</p>
            <h1 id="sheetTitle">清掃担当者チェックリスト</h1>
          </div>
          <div class="sheet-state" id="sheetState" aria-live="polite"></div>
        </header>

        <section class="cleaning-grid" id="cleaningGrid" aria-label="清掃項目"></section>

        <footer class="sheet-footer">
          <span>上にスワイプ：古い記録</span>
          <span class="footer-divider" aria-hidden="true"></span>
          <span>下にスワイプ：新しい記録・今日</span>
        </footer>
      </main>

      <aside class="sidebar" aria-label="記録情報と名前管理">
        <div class="sidebar-brand">
          <span class="brand-dot" aria-hidden="true"></span>
          <div>
            <p class="brand-kicker">CLEANING</p>
            <p class="brand-title">記録管理</p>
          </div>
        </div>

        <section class="sidebar-section date-section" aria-labelledby="dateLabel">
          <p class="section-label" id="dateLabel">表示中の日付</p>
          <p class="date-display" id="displayDate">—</p>
          <p class="weekday-display" id="displayWeekday">—</p>
        </section>

        <section class="sidebar-section history-section" aria-labelledby="historyLabel">
          <p class="section-label" id="historyLabel">履歴位置</p>
          <p class="history-position" id="historyPosition">今日</p>
          <p class="history-status" id="historyStatus">入力ページ</p>
          <div class="history-controls" aria-label="履歴を切り替える">
            <button class="history-button" id="olderButton" type="button">
              <span class="history-arrow" aria-hidden="true">↑</span>
              <span>古い記録</span>
            </button>
            <button class="history-button" id="newerButton" type="button">
              <span class="history-arrow" aria-hidden="true">↓</span>
              <span>新しい記録</span>
            </button>
          </div>
        </section>

        <section class="sidebar-section names-section" aria-labelledby="namesLabel">
          <div class="section-heading-row">
            <p class="section-label" id="namesLabel">担当者名</p>
            <span class="name-count" id="nameCount">0名</span>
          </div>
          <button class="sidebar-action primary-action" id="addNameButton" type="button">
            <span class="action-icon" aria-hidden="true">＋</span>
            <span>名前登録</span>
          </button>
          <button class="sidebar-action secondary-action" id="manageNamesButton" type="button">
            <span class="action-icon" aria-hidden="true">✎</span>
            <span>変更・削除</span>
          </button>
          <button class="sidebar-action danger-action" id="clearAllDataButton" type="button">
            <span class="action-icon" aria-hidden="true">⌫</span>
            <span>端末データを全消去</span>
          </button>
        </section>

        <div class="sidebar-footer">
          <span class="local-badge" aria-hidden="true"></span>
          <span id="storageStatus">この端末に保存</span>
        </div>
      </aside>
    </div>

    <div class="modal-backdrop" id="assignmentModal" hidden>
      <section class="modal-card assignment-card" role="dialog" aria-modal="true" aria-labelledby="assignmentModalTitle">
        <div class="modal-header">
          <div>
            <p class="modal-kicker">担当者を選択</p>
            <h2 id="assignmentModalTitle">清掃項目</h2>
          </div>
          <button class="close-button" type="button" data-close-modal aria-label="閉じる">×</button>
        </div>
        <div class="assignment-options" id="assignmentOptions"></div>
        <p class="modal-note">未選択に戻す場合は「未選択」を選んでください。</p>
      </section>
    </div>

    <div class="modal-backdrop" id="nameModal" hidden>
      <section class="modal-card name-card" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
        <div class="modal-header">
          <div>
            <p class="modal-kicker">担当者名</p>
            <h2 id="nameModalTitle">名前を登録</h2>
          </div>
          <button class="close-button" type="button" data-close-modal aria-label="閉じる">×</button>
        </div>
        <form id="nameForm" novalidate>
          <label class="field-label" for="newNameInput">名前</label>
          <input id="newNameInput" class="text-input" type="text" maxlength="20" autocomplete="off" placeholder="例：山田 太郎" />
          <p class="form-error" id="nameFormError" role="alert" hidden></p>
          <div class="modal-actions">
            <button class="modal-button secondary-modal-button" type="button" data-close-modal>キャンセル</button>
            <button class="modal-button primary-modal-button" type="submit">登録</button>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="manageModal" hidden>
      <section class="modal-card manage-card" role="dialog" aria-modal="true" aria-labelledby="manageModalTitle">
        <div class="modal-header">
          <div>
            <p class="modal-kicker">担当者名</p>
            <h2 id="manageModalTitle">変更・削除</h2>
          </div>
          <button class="close-button" type="button" data-close-modal aria-label="閉じる">×</button>
        </div>
        <div class="manage-list" id="manageNamesList"></div>
        <p class="empty-names" id="emptyNamesState" hidden>登録済みの名前はありません。<br />「名前登録」から追加してください。</p>
        <div class="modal-actions manage-actions">
          <button class="modal-button secondary-modal-button" type="button" data-close-modal>閉じる</button>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="confirmModal" hidden>
      <section class="modal-card confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <div class="confirm-icon" aria-hidden="true">!</div>
        <h2 id="confirmModalTitle">確認</h2>
        <p id="confirmModalMessage"></p>
        <div class="modal-actions">
          <button class="modal-button secondary-modal-button" id="confirmCancelButton" type="button">キャンセル</button>
          <button class="modal-button danger-modal-button" id="confirmOkButton" type="button">削除する</button>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>
    <script src="./app.js" defer></script>
  </body>
</html>
